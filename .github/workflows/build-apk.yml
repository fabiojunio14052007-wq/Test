name: Build iQOO 15T 144Hz Tweaker APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Official RmsVote.dex into assets if missing
        run: |
          mkdir -p app/src/main/assets
          if [ ! -f app/src/main/assets/RmsVote.dex ]; then
            curl -L -s https://raw.githubusercontent.com/AndroPlus-org/vivo-HighRefresh-NoRoot/main/RmsVote.dex -o app/src/main/assets/RmsVote.dex
          fi
          ls -la app/src/main/assets/RmsVote.dex

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APKs (Standard & Benchmark Spoof)
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Compiled APKs
        uses: actions/upload-artifact@v4
        with:
          name: iQOO-15T-144Hz-Tweaker-APKs
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14
